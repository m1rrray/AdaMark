# ---- Evaluation configuration ----

# base hyperparameters
batch_size: 16
num_workers: 4

# test dataset directories
test_datasets:
  # casia1: "../datasets/CASIA1"
  # casia2: "../datasets/CASIA2_revised"
  # columbia: "../datasets/Columbia_final"

# evaluate on a subset of the dataset; leave empty to use all images
limit:

# print detailed progress during evaluation
verbose: True

# evaluate only the last saved checkpoint, ignoring the best-model paths below
last: False
last_path: './checkpoints_models_rf/last.pth'

# paths to the best models to evaluate
hiding_net_path: "./checkpoints_models_rf/hiding_net_best.pth"
revealing_net_path: "./checkpoints_models_rf/revealing_net_best.pth"
