# ---- Training configuration ----

# base hyperparameters
learning_rate: 0.00035
batch_size: 64
epochs: 150
seed: 42
num_workers: 12

# cosine annealing schedule
eta_min: 1.0e-7
T_max: 150

# when resuming, discard optimizer state so the learning rate can be changed
warm_start: False

# data paths
train_cover_dir: "../datasets/ffhq/images256x256"
save_dir: "./checkpoints_models_rf"

# train/validation split of the cover dataset
val_ratio: 0.1
split_seed: 42

# early stopping
patience: 15

# loss weights; lambda_h is fixed at 1.0 inside HidingLoss
revealing_loss_weight: 3
lambda_fft: 3

# resume training from the last saved checkpoint
resume: False
resume_path: './checkpoints_models_rf/last.pth'
